name: Bug report
description: A number looks wrong, the build fails, or the dashboard misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## First, the one rule that matters here

        **Do not attach your data.** Your data package, your `data.json` and
        your built dashboard all contain your contacts' names, your servers and
        your activity. This tracker is public and permanent, and those people
        never agreed to appear in it.

        Everything below can be answered without any of that. If you genuinely
        cannot reproduce a problem without real data, say so and we will find
        another way — do not upload it.

  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I am not attaching my data package, my `data.json`, or my dashboard, and any screenshot I include shows no real names.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Build output
      description: |
        The console output of `node build.mjs`.

        **Remove the first line before pasting** — it prints the full path to
        your package and on most systems that contains your user name. The
        totals further down (hours, message counts, server counts) describe
        your own usage; blank them out if you would rather not publish them.
        The counts are usually not what the bug hinges on.
      render: text

  - type: dropdown
    id: sample
    attributes:
      label: Does it also happen with the sample package?
      description: |
        `node tools/make-sample-package.mjs` then
        `node build.mjs --package sample-package`. If it reproduces there, we
        can debug it on data nobody has to protect — that is the fastest path
        to a fix by a wide margin.
      options:
        - "Yes, the sample package shows it too"
        - "No, only my own package"
        - "I have not tried yet"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language of your Discord export
      description: |
        Which language were the folders in? English gives `activity` and
        `messages`, German gives `Aktivität` and `Nachrichten`, and so on. Folder
        detection is a common source of trouble, so this is worth a line.
      placeholder: English

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: Browser, screen size, what you had already clicked — whatever seems relevant.
